<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trueque Match — Ofertas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .sidebar { width:260px; flex-shrink:0; }
    .filter-card { background:var(--gris-card); border:1px solid var(--gris-borde); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; }
    .filter-title { font-family:var(--font-display); font-size:14px; color:var(--blanco-calido); letter-spacing:1px; margin-bottom:14px; }
    .filter-option { display:flex; align-items:center; gap:8px; padding:6px 0; cursor:pointer; font-size:14px; color:var(--gris-medio); border-radius:var(--radius-sm); transition:var(--transition); }
    .filter-option:hover { color:var(--blanco-calido); }
    .filter-option input { accent-color:var(--rojo-tm); }
    .filter-option.active { color:var(--rojo-tm); }
    .main-area { flex:1; }
    .results-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .sort-select { background:var(--gris-input); border:1px solid var(--gris-borde); border-radius:var(--radius-md); color:var(--blanco-calido); padding:8px 14px; font-size:13px; cursor:pointer; }
    .oferta-list-card { background:var(--gris-card); border:1px solid var(--gris-borde); border-radius:var(--radius-lg); padding:16px; display:flex; gap:16px; transition:var(--transition); cursor:pointer; }
    .oferta-list-card:hover { border-color:var(--rojo-border); transform:translateX(4px); box-shadow:var(--shadow-glow); }
    .oferta-list-img { width:80px; height:80px; border-radius:var(--radius-md); background:var(--gris-borde); display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0; }
    .oferta-list-body { flex:1; }
    .oferta-list-title { font-weight:700; font-size:15px; margin-bottom:4px; }
    .oferta-list-desc { color:var(--gris-medio); font-size:13px; margin-bottom:8px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .oferta-list-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .chip { display:inline-flex; align-items:center; gap:4px; background:var(--gris-borde); border-radius:var(--radius-full); padding:3px 10px; font-size:12px; color:var(--gris-medio); }
    @media(max-width:768px){ .sidebar{display:none;} }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand"><img src="LOGO_FINAL.png" alt="Trueque Match" style="height:44px; width:auto;"></a>
    <div class="navbar-nav">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="ofertas.html" class="nav-link active">Ofertas</a>
      <a href="dashboard.html" class="nav-link">Mi cuenta</a>
      <a href="login.html" class="btn btn-primary btn-sm" style="margin-left:8px">Ingresar</a>
    </div>
  </nav>

  <div class="section">
    <div class="container">
      <h1 class="section-title" style="margin-bottom:6px;">EXPLORAR OFERTAS</h1>
      <p class="section-subtitle">Encuentra lo que necesitas para intercambiar</p>

      <!-- BUSCADOR -->
      <div class="search-bar mb-lg" style="max-width:600px;">
        <span class="search-icon"><i class="fa fa-search"></i></span>
        <input type="text" placeholder="Buscar ofertas por nombre, ciudad o categoría..." id="searchInput" oninput="filterOfertas()">
        <button class="btn btn-primary btn-sm" onclick="filterOfertas()">Buscar</button>
      </div>

      <div class="flex gap-lg">
        <!-- SIDEBAR FILTROS -->
        <div class="sidebar">
          <div class="filter-card">
            <div class="filter-title">CATEGORÍA</div>
            <label class="filter-option"><input type="checkbox" checked value="todos" onchange="filterOfertas()"> Todas</label>
            <label class="filter-option"><input type="checkbox" value="producto" onchange="filterOfertas()"> 📦 Productos</label>
            <label class="filter-option"><input type="checkbox" value="servicio" onchange="filterOfertas()"> 🛠️ Servicios</label>
            <label class="filter-option"><input type="checkbox" value="conocimiento" onchange="filterOfertas()"> 📚 Conocimiento</label>
            <label class="filter-option"><input type="checkbox" value="experiencia" onchange="filterOfertas()"> 🎭 Experiencias</label>
          </div>
          <div class="filter-card">
            <div class="filter-title">CIUDAD</div>
            <label class="filter-option"><input type="checkbox" value="bogota" onchange="filterOfertas()"> Bogotá</label>
            <label class="filter-option"><input type="checkbox" value="medellin" onchange="filterOfertas()"> Medellín</label>
            <label class="filter-option"><input type="checkbox" value="cali" onchange="filterOfertas()"> Cali</label>
            <label class="filter-option"><input type="checkbox" value="barranquilla" onchange="filterOfertas()"> Barranquilla</label>
          </div>
          <div class="filter-card">
            <div class="filter-title">ESTADO</div>
            <label class="filter-option"><input type="checkbox" value="activa" onchange="filterOfertas()"> ✅ Disponible</label>
            <label class="filter-option"><input type="checkbox" value="reciente" onchange="filterOfertas()"> 🔥 Reciente</label>
          </div>
        </div>

        <!-- MAIN -->
        <div class="main-area">
          <div class="results-bar">
            <span style="color:var(--gris-medio); font-size:14px;" id="resultCount">Mostrando 8 ofertas</span>
            <select class="sort-select" onchange="filterOfertas()">
              <option>Más recientes</option>
              <option>Más populares</option>
              <option>A - Z</option>
            </select>
          </div>

          <div id="ofertasList" style="display:flex; flex-direction:column; gap:12px;">
            <!-- Generadas por JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <footer>
    <div class="container">
      <div class="footer-bottom" style="border:none; padding:0; margin:0;">
        <p>© 2026 Trueque Match · G.L. Software Solutions · Bogotá, Colombia</p>
        <p>Gerson López Oviedo · Ficha 3186647 · SENA</p>
      </div>
    </div>
  </footer>

  <script>
    const ofertas = [
      { id:1, icon:'📦', titulo:'Bicicleta montañera rodado 26', desc:'Bici en buen estado, frenos de disco, talla M. Lista para rodar por la ciudad o el campo.', categoria:'producto', ciudad:'Bogotá', usuario:'Carlos M.', avatar:'C', avColor:'#C0392B', tiempo:'Hace 2h' },
      { id:2, icon:'🎸', titulo:'Clases de guitarra (10 sesiones)', desc:'Soy músico profesional con 8 años de experiencia. Clases para principiantes e intermedios.', categoria:'servicio', ciudad:'Medellín', usuario:'Ana P.', avatar:'A', avColor:'#2980B9', tiempo:'Hace 3h' },
      { id:3, icon:'💻', titulo:'Curso Python completo (PDF + videos)', desc:'Material completo de Python desde cero hasta nivel intermedio. Incluye ejercicios prácticos.', categoria:'conocimiento', ciudad:'Cali', usuario:'Luis R.', avatar:'L', avColor:'#27AE60', tiempo:'Hace 5h' },
      { id:4, icon:'🍳', titulo:'Clases de cocina italiana', desc:'Aprende a cocinar pasta fresca, risotto y tiramisú. 5 sesiones de 2 horas en mi cocina.', categoria:'experiencia', ciudad:'Bogotá', usuario:'María G.', avatar:'M', avColor:'#8E44AD', tiempo:'Hace 1d' },
      { id:5, icon:'🔧', titulo:'Reparación de computadores PC', desc:'Técnico en sistemas con 5 años de experiencia. Arreglo hardware y software, formateo incluido.', categoria:'servicio', ciudad:'Barranquilla', usuario:'Pedro L.', avatar:'P', avColor:'#E67E22', tiempo:'Hace 2d' },
      { id:6, icon:'📱', titulo:'iPhone 11 (128GB) seminuevo', desc:'Celular en perfectas condiciones, batería al 89%, con estuche y cargador original.', categoria:'producto', ciudad:'Medellín', usuario:'Sandra V.', avatar:'S', avColor:'#C0392B', tiempo:'Hace 2d' },
      { id:7, icon:'🎨', titulo:'Diseño de logo profesional', desc:'Diseñadora gráfica. Te entrego el logo en todos los formatos: PNG, SVG, PDF. 3 propuestas.', categoria:'servicio', ciudad:'Bogotá', usuario:'Laura T.', avatar:'L', avColor:'#2980B9', tiempo:'Hace 3d' },
      { id:8, icon:'📚', titulo:'Inglés para negocios (8 sesiones)', desc:'Profesora certificada IELTS. Clases enfocadas en vocabulario y conversación para trabajo.', categoria:'conocimiento', ciudad:'Cali', usuario:'Andrés F.', avatar:'A', avColor:'#1E8449', tiempo:'Hace 4d' },
    ];

    const cats = { producto:'badge-red', servicio:'badge-blue', conocimiento:'badge-green', experiencia:'badge-yellow' };
    const catLabels = { producto:'Producto', servicio:'Servicio', conocimiento:'Conocimiento', experiencia:'Experiencia' };

    function renderOfertas(list) {
      const container = document.getElementById('ofertasList');
      document.getElementById('resultCount').textContent = `Mostrando ${list.length} oferta${list.length!==1?'s':''}`;
      container.innerHTML = list.map(o => `
        <div class="oferta-list-card" onclick="showToast('Próximamente: vista de detalle de la oferta')">
          <div class="oferta-list-img">${o.icon}</div>
          <div class="oferta-list-body">
            <div class="oferta-list-title">${o.titulo}</div>
            <div class="oferta-list-desc">${o.desc}</div>
            <div class="oferta-list-meta">
              <span class="badge ${cats[o.categoria]}">${catLabels[o.categoria]}</span>
              <span class="chip"><i class="fa fa-map-marker-alt"></i> ${o.ciudad}</span>
              <span class="chip"><i class="fa fa-clock"></i> ${o.tiempo}</span>
              <span class="chip" style="margin-left:auto;">
                <div class="avatar avatar-sm" style="background:${o.avColor}; width:20px; height:20px; font-size:10px;">${o.avatar}</div>
                ${o.usuario}
              </span>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; justify-content:center; gap:8px; padding-left:8px;">
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); showToast('¡Propuesta enviada! ✅')"><i class="fa fa-handshake"></i></button>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); showToast('Guardado en favoritos ❤️')"><i class="fa fa-heart"></i></button>
          </div>
        </div>
      `).join('');
    }

    function filterOfertas() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = ofertas.filter(o =>
        o.titulo.toLowerCase().includes(query) ||
        o.desc.toLowerCase().includes(query) ||
        o.ciudad.toLowerCase().includes(query)
      );
      renderOfertas(filtered);
    }

    function showToast(msg) {
      const tc = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = 'toast success';
      t.textContent = msg;
      tc.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    renderOfertas(ofertas);
  </script>
</body>
</html>
